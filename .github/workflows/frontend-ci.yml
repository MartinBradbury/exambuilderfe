name: ExamBuilder Frontend CI

on:
    push:
        branches:
            - main
            - chore/setup-ci-cd
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        name: Lint and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build React application
              run: npm run build
