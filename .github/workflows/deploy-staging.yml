name: Deploy Frontend to Staging

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: frontend-staging-deployment
    cancel-in-progress: false

jobs:
    deploy-staging:
        name: Deploy to Netlify Staging
        runs-on: ubuntu-latest

        steps:
            - name: Checkout selected branch
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build for staging
              env:
                  VITE_API_BASE_URL: https://exambuilder-staging-e3f9e4c51418.herokuapp.com
              run: npm run build

            - name: Verify staging API URL
              run: |
                  if ! grep -rqF \
                    "https://exambuilder-staging-e3f9e4c51418.herokuapp.com" \
                    dist; then
                    echo "Staging API URL not found in build."
                    exit 1
                  fi

                  if grep -rqF \
                    "https://exambuilder-efae14d59f03.herokuapp.com" \
                    dist; then
                    echo "Production API URL found in staging build."
                    exit 1
                  fi

            - name: Deploy to Netlify staging
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ vars.NETLIFY_STAGING_SITE_ID }}
              run: |
                  test -n "$NETLIFY_AUTH_TOKEN"
                  test -n "$NETLIFY_SITE_ID"
                  npx --yes netlify-cli@latest deploy \
                    --prod \
                    --dir=dist \
                    --site="$NETLIFY_SITE_ID" \
                    --message="Staging deployment from ${GITHUB_REF_NAME}"
